---
layout: default
---
<section class="section light-bg">
    <div class="container">
        <article class="content">
            <div style="margin-bottom: 40px;">
                <h1>{{ page.title }}</h1>
                <p class="subtitle">{{ page.description }}</p>
            </div>
            
            {% if page.image %}
                <img src="{{ page.image }}" alt="{{ page.title }}" style="max-width: 100%; border-radius: 8px; margin-bottom: 30px;">
            {% endif %}

            {{ content }}
        </article>
    </div>
</section>
